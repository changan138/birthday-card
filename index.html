<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐</title>
<meta name="description" content="一份会唱歌、会放烟花、还能吹蜡烛的生日贺卡">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎂%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:#fff;overflow-x:hidden;min-height:100vh;
    background:linear-gradient(180deg,#140b3d 0%,#2c1460 30%,#5b2470 62%,#8f3d7e 84%,#b85a8c 100%);
  }
  #card{opacity:0;transition:opacity 1.2s ease}
  body.opened #card{opacity:1}

  /* ============ 音乐按钮 ============ */
  #musicBtn{
    position:fixed;top:16px;right:16px;z-index:80;width:52px;height:52px;border-radius:50%;
    border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);
    backdrop-filter:blur(8px);color:#fff;font-size:24px;cursor:pointer;display:none;
    transition:transform .2s,background .2s;
  }
  body.opened #musicBtn{display:block}
  #musicBtn:hover{transform:scale(1.08)}
  #musicBtn.on{background:rgba(255,190,90,.28);animation:pulseRing 2s infinite}
  @keyframes pulseRing{
    0%{box-shadow:0 0 0 0 rgba(255,200,110,.5)}
    70%{box-shadow:0 0 0 14px rgba(255,200,110,0)}
    100%{box-shadow:0 0 0 0 rgba(255,200,110,0)}
  }

  /* ============ 开卡信封 ============ */
  #overlay{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:30px;cursor:pointer;
    background:radial-gradient(circle at 50% 28%,#3b1f6e 0%,#1c0f45 60%,#12082e 100%);
    transition:opacity .7s ease;
  }
  #overlay.opening{opacity:0;pointer-events:none}
  .envelope{width:min(430px,86vw);filter:drop-shadow(0 20px 50px rgba(0,0,0,.5));perspective:900px}
  .envelope .flap-top{transform-box:fill-box;transform-origin:50% 0;transition:transform .65s ease-in}
  .envelope .letter{transform-box:fill-box;transition:transform .7s .5s ease-in}
  #overlay.opening .flap-top{transform:rotateX(-180deg)}
  #overlay.opening .letter{transform:translateY(-140px)}
  .ov-hint{color:#ffe9c9;font-size:1rem;letter-spacing:.18em;animation:hintPulse 1.8s ease-in-out infinite}
  .ov-sub{color:rgba(255,233,201,.55);font-size:.82rem;letter-spacing:.1em}
  @keyframes hintPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}

  /* ============ 首屏 ============ */
  .hero{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:80px 20px 60px;
    position:relative;overflow:hidden;cursor:crosshair;
  }
  #stars,#balloons{position:absolute;inset:0;pointer-events:none;z-index:1}
  .star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s ease-in-out infinite}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  .balloon{
    position:absolute;bottom:-280px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85),var(--c) 55%);
    animation:rise var(--d) linear infinite;animation-delay:var(--delay);
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.25));
  }
  .balloon::after{content:'';position:absolute;left:50%;top:99%;width:2px;height:72px;background:rgba(255,255,255,.5)}
  .balloon::before{content:'';position:absolute;left:50%;top:100%;transform:translateX(-50%);
    width:0;height:0;border:6px solid transparent;border-top:10px solid rgba(0,0,0,.3);border-bottom:none}
  @keyframes rise{
    0%{transform:translateY(0) rotate(-3deg)}
    25%{transform:translateY(-26vh) rotate(3deg)}
    50%{transform:translateY(-52vh) rotate(-3deg)}
    75%{transform:translateY(-78vh) rotate(3deg)}
    100%{transform:translateY(-110vh) rotate(-3deg)}
  }
  .hero-inner{position:relative;z-index:2}
  body.opened .hero-inner{animation:fadeUp .9s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  .hero .en{letter-spacing:.55em;text-indent:.55em;color:#ffd8a8;font-size:clamp(.7rem,2.4vw,.95rem);opacity:.9;margin-bottom:14px}
  .title{
    font-family:"STKaiti","KaiTi","楷体","SimKai",serif;
    font-size:clamp(3.2rem,11vw,6.5rem);font-weight:700;line-height:1.15;letter-spacing:.08em;
    background:linear-gradient(180deg,#fff3c4 0%,#ffd98e 45%,#ffb84d 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:titleGlow 3s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%,100%{filter:drop-shadow(0 0 16px rgba(255,190,90,.35))}
    50%{filter:drop-shadow(0 0 30px rgba(255,210,120,.7))}
  }
  #nameLine{
    display:inline-block;margin-top:16px;padding:10px 28px;border-radius:999px;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(6px);color:#ffe9c9;font-size:clamp(1.05rem,3.4vw,1.55rem);
  }
  .sub{margin-top:14px;color:rgba(255,255,255,.85);font-size:clamp(.95rem,3vw,1.15rem)}
  .cake-wrap{width:min(440px,84vw);margin-top:22px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.35))}
  .cake-wrap svg{width:100%;height:auto;display:block;pointer-events:none}
  .candle{pointer-events:auto;cursor:pointer}
  .candle:hover .flame{filter:brightness(1.35)}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.3s ease-in-out infinite}
  .glow{transform-box:fill-box;transform-origin:center;animation:glowPulse 1.3s ease-in-out infinite}
  @keyframes glowPulse{0%,100%{opacity:.3}50%{opacity:.55}}
  @keyframes flicker{
    0%,100%{transform:scaleY(1) scaleX(1) rotate(-2deg)}
    30%{transform:scaleY(1.15) scaleX(.9) rotate(2deg)}
    60%{transform:scaleY(.92) scaleX(1.06) rotate(-3deg)}
    80%{transform:scaleY(1.08) scaleX(.94) rotate(2deg)}
  }
  .candle.out .flame,.candle.out .glow{display:none}
  .smoke{opacity:0;transform-box:fill-box;transform-origin:center}
  .candle.out .smoke{animation:smokeUp 1.6s ease-out forwards}
  @keyframes smokeUp{
    0%{opacity:0;transform:translateY(0) scale(.6)}
    20%{opacity:.75}
    100%{opacity:0;transform:translateY(-48px) scale(1.9)}
  }
  .hint{margin-top:18px;color:rgba(255,255,255,.8);font-size:.95rem}
  .scroll-hint{margin-top:30px;font-size:1.7rem;color:#ffd8a8;cursor:pointer;animation:bounce 1.6s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}

  /* ============ 愿望横幅 ============ */
  #wishBanner{
    position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:75;
    background:linear-gradient(135deg,#ff7eb3,#ffd166);color:#5b1a4d;font-weight:700;
    font-size:clamp(1.2rem,4.5vw,2rem);padding:14px 36px;border-radius:999px;
    box-shadow:0 10px 40px rgba(0,0,0,.35);opacity:0;pointer-events:none;white-space:nowrap;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
  }
  #wishBanner.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  /* ============ 通用章节 ============ */
  section{position:relative}
  .section-title{
    font-family:"STKaiti","KaiTi","楷体","SimKai",serif;
    font-size:clamp(1.8rem,5vw,2.6rem);color:#fff3c4;margin-bottom:8px;
  }
  .section-sub{color:rgba(255,255,255,.72);margin-bottom:42px;font-size:.95rem;letter-spacing:.1em}

  /* ============ 照片墙 ============ */
  .gallery{padding:90px 20px 70px;text-align:center}
  .polaroids{display:flex;flex-wrap:wrap;gap:36px;justify-content:center}
  .polaroid{
    background:#fffdf8;padding:12px 12px 16px;border-radius:8px;
    box-shadow:0 14px 34px rgba(0,0,0,.35);transition:transform .35s ease;
  }
  .polaroid:nth-child(1){transform:rotate(-5deg)}
  .polaroid:nth-child(2){transform:rotate(3deg) translateY(16px)}
  .polaroid:nth-child(3){transform:rotate(-2deg)}
  .polaroid:hover{transform:rotate(0) translateY(-10px) scale(1.05);z-index:5}
  .polaroid img{width:min(230px,72vw);height:min(230px,72vw);object-fit:cover;display:block;border-radius:4px;background:#f3e9f8}
  .polaroid figcaption{margin-top:10px;color:#7a5c4a;font-size:.95rem}

  /* ============ 祝福语 ============ */
  .wishes{padding:40px 20px 120px;text-align:center}
  .wish-card{
    max-width:660px;margin:0 auto;border-radius:24px;padding:48px 38px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);
    backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .wish-text{
    font-family:"STKaiti","KaiTi","楷体","SimKai",serif;
    font-size:clamp(1.15rem,3.2vw,1.5rem);line-height:2;color:#fff5e6;white-space:pre-line;
  }
  #sign{display:block;margin-top:28px;color:#ffd8a8;letter-spacing:.2em}
  #fireworksBtn{
    margin-top:36px;cursor:pointer;font-family:inherit;font-size:1.05rem;font-weight:700;
    color:#5b1a4d;background:linear-gradient(135deg,#ffd166,#ff9a5a);border:none;
    border-radius:999px;padding:14px 40px;box-shadow:0 8px 24px rgba(255,160,90,.4);
    transition:transform .2s;
  }
  #fireworksBtn:hover{transform:translateY(-3px) scale(1.03)}
  #fireworksBtn:active{transform:scale(.97)}
  .deco{position:absolute;font-size:2rem;opacity:.55;animation:floaty 5s ease-in-out infinite;pointer-events:none}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(6deg)}}

  /* ============ 页脚 ============ */
  footer{
    padding:30px 20px 40px;text-align:center;color:rgba(255,255,255,.6);font-size:.85rem;
    border-top:1px solid rgba(255,255,255,.15);letter-spacing:.1em;
  }

  /* ============ 画布 ============ */
  #fireworks,#confetti{position:fixed;inset:0;pointer-events:none}
  #fireworks{z-index:55}
  #confetti{z-index:60}

  /* ============ 滚动显现 ============ */
  .reveal{opacity:0;transform:translateY(34px);transition:opacity .8s ease,transform .8s ease}
  .reveal.show{opacity:1;transform:none}

  @media (max-width:520px){
    .wish-card{padding:36px 24px}
  }
</style>
</head>
<body>

<canvas id="fireworks"></canvas>
<canvas id="confetti"></canvas>
<button id="musicBtn" title="开关音乐">🎵</button>

<div id="wishBanner"></div>

<!-- 开卡信封 -->
<div id="overlay">
  <svg class="envelope" viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg">
    <rect x="12" y="40" width="396" height="240" rx="12" fill="#f5e6cf"/>
    <g class="letter">
      <rect x="44" y="58" width="332" height="214" rx="10" fill="#fffdf6"/>
      <text x="210" y="148" text-anchor="middle" font-size="44" font-family="STKaiti,KaiTi,serif" fill="#d94f7f">生日快乐</text>
      <text x="210" y="196" text-anchor="middle" font-size="20" fill="#b98f6a">给最特别的你</text>
      <text x="210" y="240" text-anchor="middle" font-size="18" fill="#e0b8c8">🎂 🎈 🎁</text>
    </g>
    <polygon points="12,42 206,216 12,276" fill="#e9cba6" stroke="#d8b78c" stroke-width="2"/>
    <polygon points="408,42 214,216 408,276" fill="#e2c199" stroke="#d8b78c" stroke-width="2"/>
    <g class="flap-top">
      <polygon points="12,48 210,214 408,48" fill="#fbf0dc" stroke="#d8b78c" stroke-width="2"/>
      <circle cx="210" cy="192" r="34" fill="#ff5d7e" stroke="#e8446a" stroke-width="3"/>
      <text x="210" y="209" text-anchor="middle" font-size="36">🎂</text>
    </g>
  </svg>
  <p class="ov-hint">💌 点 击 信 封 · 打 开 贺 卡</p>
  <p class="ov-sub">打开后八音盒音乐会自动响起 🎶</p>
</div>

<!-- 贺卡主体 -->
<main id="card">

  <section class="hero" id="hero">
    <div id="stars"></div>
    <div id="balloons"></div>
    <div class="hero-inner">
      <p class="en">HAPPY BIRTHDAY</p>
      <h1 class="title">生日快乐</h1>
      <p id="nameLine"></p>
      <p class="sub" id="subLine"></p>
      <div class="cake-wrap">
        <svg viewBox="0 0 420 400" xmlns="http://www.w3.org/2000/svg" aria-label="生日蛋糕">
          <defs>
            <linearGradient id="tier1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff9ec4"/><stop offset="1" stop-color="#f26f9e"/>
            </linearGradient>
            <linearGradient id="tier2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff3d6"/><stop offset="1" stop-color="#ffe0ad"/>
            </linearGradient>
            <linearGradient id="tier3" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffb7d5"/><stop offset="1" stop-color="#ff8fb8"/>
            </linearGradient>
            <linearGradient id="candleG" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#ffb84d"/>
            </linearGradient>
            <radialGradient id="flameG" cx=".5" cy=".72" r=".75">
              <stop offset="0" stop-color="#fff9d9"/><stop offset=".55" stop-color="#ffd166"/><stop offset="1" stop-color="#ff7b3d"/>
            </radialGradient>
            <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="5"/>
            </filter>
          </defs>

          <ellipse cx="210" cy="368" rx="150" ry="14" fill="#000" opacity=".18"/>
          <ellipse cx="210" cy="150" rx="130" ry="70" fill="#ffd166" opacity=".12" filter="url(#soft)"/>

          <!-- 蜡烛 -->
          <g class="candle"><rect x="163" y="84" width="10" height="40" rx="3" fill="url(#candleG)"/><rect x="163" y="84" width="10" height="9" fill="#ff6b9d"/><rect x="167" y="76" width="2" height="6" fill="#8d6e63"/><ellipse class="glow" cx="168" cy="70" rx="15" ry="13" fill="#ffd166" opacity=".4" filter="url(#soft)"/><path class="flame" d="M168 56 C 161.5 64, 161.5 73, 168 78 C 174.5 73, 174.5 64, 168 56 Z" fill="url(#flameG)"/><circle class="smoke" cx="168" cy="58" r="5" fill="#d7d9e0"/></g>
          <g class="candle"><rect x="184" y="84" width="10" height="40" rx="3" fill="url(#candleG)"/><rect x="184" y="84" width="10" height="9" fill="#69db7c"/><rect x="188" y="76" width="2" height="6" fill="#8d6e63"/><ellipse class="glow" cx="189" cy="70" rx="15" ry="13" fill="#ffd166" opacity=".4" filter="url(#soft)"/><path class="flame" d="M189 56 C 182.5 64, 182.5 73, 189 78 C 195.5 73, 195.5 64, 189 56 Z" fill="url(#flameG)"/><circle class="smoke" cx="189" cy="58" r="5" fill="#d7d9e0"/></g>
          <g class="candle"><rect x="205" y="84" width="10" height="40" rx="3" fill="url(#candleG)"/><rect x="205" y="84" width="10" height="9" fill="#4dabf7"/><rect x="209" y="76" width="2" height="6" fill="#8d6e63"/><ellipse class="glow" cx="210" cy="70" rx="15" ry="13" fill="#ffd166" opacity=".4" filter="url(#soft)"/><path class="flame" d="M210 56 C 203.5 64, 203.5 73, 210 78 C 216.5 73, 216.5 64, 210 56 Z" fill="url(#flameG)"/><circle class="smoke" cx="210" cy="58" r="5" fill="#d7d9e0"/></g>
          <g class="candle"><rect x="226" y="84" width="10" height="40" rx="3" fill="url(#candleG)"/><rect x="226" y="84" width="10" height="9" fill="#b197fc"/><rect x="230" y="76" width="2" height="6" fill="#8d6e63"/><ellipse class="glow" cx="231" cy="70" rx="15" ry="13" fill="#ffd166" opacity=".4" filter="url(#soft)"/><path class="flame" d="M231 56 C 224.5 64, 224.5 73, 231 78 C 237.5 73, 237.5 64, 231 56 Z" fill="url(#flameG)"/><circle class="smoke" cx="231" cy="58" r="5" fill="#d7d9e0"/></g>
          <g class="candle"><rect x="247" y="84" width="10" height="40" rx="3" fill="url(#candleG)"/><rect x="247" y="84" width="10" height="9" fill="#ff8787"/><rect x="251" y="76" width="2" height="6" fill="#8d6e63"/><ellipse class="glow" cx="252" cy="70" rx="15" ry="13" fill="#ffd166" opacity=".4" filter="url(#soft)"/><path class="flame" d="M252 56 C 245.5 64, 245.5 73, 252 78 C 258.5 73, 258.5 64, 252 56 Z" fill="url(#flameG)"/><circle class="smoke" cx="252" cy="58" r="5" fill="#d7d9e0"/></g>

          <!-- 顶层 -->
          <rect x="142" y="126" width="136" height="72" rx="12" fill="url(#tier3)"/>
          <g fill="#fff0f7">
            <circle cx="159" cy="126" r="15"/><circle cx="193" cy="126" r="15"/>
            <circle cx="227" cy="126" r="15"/><circle cx="261" cy="126" r="15"/>
          </g>
          <!-- 中层 -->
          <rect x="104" y="196" width="212" height="74" rx="14" fill="url(#tier2)"/>
          <g fill="#fff8ea">
            <circle cx="125" cy="196" r="17"/><circle cx="167" cy="196" r="17"/><circle cx="209" cy="196" r="17"/>
            <circle cx="251" cy="196" r="17"/><circle cx="293" cy="196" r="17"/>
          </g>
          <!-- 底层 -->
          <rect x="66" y="268" width="288" height="92" rx="16" fill="url(#tier1)"/>
          <g fill="#fff4f9">
            <circle cx="90" cy="268" r="19"/><circle cx="138" cy="268" r="19"/><circle cx="186" cy="268" r="19"/>
            <circle cx="234" cy="268" r="19"/><circle cx="282" cy="268" r="19"/><circle cx="330" cy="268" r="19"/>
          </g>
          <!-- 糖粒 -->
          <g>
            <rect x="100" y="292" width="10" height="4" rx="2" fill="#fff" transform="rotate(-20 105 294)"/>
            <rect x="150" y="316" width="10" height="4" rx="2" fill="#ffd166" transform="rotate(14 155 318)"/>
            <rect x="210" y="296" width="10" height="4" rx="2" fill="#7ec8ff" transform="rotate(-8 215 298)"/>
            <rect x="266" y="318" width="10" height="4" rx="2" fill="#fff" transform="rotate(22 271 320)"/>
            <rect x="316" y="300" width="10" height="4" rx="2" fill="#b197fc" transform="rotate(-14 321 302)"/>
            <rect x="132" y="224" width="10" height="4" rx="2" fill="#ff8787" transform="rotate(16 137 226)"/>
            <rect x="182" y="214" width="10" height="4" rx="2" fill="#7ee081" transform="rotate(-10 187 216)"/>
            <rect x="242" y="226" width="10" height="4" rx="2" fill="#ffd166" transform="rotate(24 247 228)"/>
            <rect x="286" y="216" width="10" height="4" rx="2" fill="#4dabf7" transform="rotate(-18 291 218)"/>
            <rect x="160" y="152" width="10" height="4" rx="2" fill="#ffd166" transform="rotate(12 165 154)"/>
            <rect x="208" y="148" width="10" height="4" rx="2" fill="#fff" transform="rotate(-6 213 150)"/>
            <rect x="256" y="154" width="10" height="4" rx="2" fill="#7ee081" transform="rotate(18 261 156)"/>
          </g>
          <!-- 盘子 -->
          <ellipse cx="210" cy="362" rx="168" ry="20" fill="#f7f3ee"/>
          <ellipse cx="210" cy="360" rx="168" ry="18" fill="none" stroke="#d9d2c8" stroke-width="3"/>
        </svg>
      </div>
      <p class="hint">点一点蜡烛，帮 TA 吹灭，许个愿望 ✨</p>
      <div class="scroll-hint" title="往下看">▾</div>
    </div>
  </section>

  <section class="gallery reveal">
    <h2 class="section-title">我们的回忆</h2>
    <p class="section-sub">— 那 些 闪 闪 发 光 的 瞬 间 —</p>
    <div class="polaroids">
      <figure class="polaroid"><img alt="照片1"><figcaption></figcaption></figure>
      <figure class="polaroid"><img alt="照片2"><figcaption></figcaption></figure>
      <figure class="polaroid"><img alt="照片3"><figcaption></figcaption></figure>
    </div>
  </section>

  <section class="wishes reveal">
    <span class="deco" style="left:12%;top:8%;animation-delay:.2s">🎁</span>
    <span class="deco" style="right:14%;top:16%;animation-delay:1.1s">🎈</span>
    <span class="deco" style="left:20%;bottom:18%;animation-delay:2s">✨</span>
    <span class="deco" style="right:22%;bottom:10%;animation-delay:.6s">🎉</span>
    <h2 class="section-title">想对你说的话</h2>
    <p class="section-sub">— 所 有 祝 福 都 给 你 —</p>
    <div class="wish-card">
      <p class="wish-text" id="wishText"></p>
      <span id="sign"></span>
      <button id="fireworksBtn">🎆 放一场烟花</button>
    </div>
  </section>

  <footer>
    🎂 生日快乐 · 岁岁平安 · 万事胜意 🎂
  </footer>

</main>

<script>
/* ================================================================
 * ✏️ 在这里修改贺卡内容
 * ================================================================ */
const CONFIG = {
  name: '亲爱的你',                          // 寿星称呼
  sub: '愿你的每一天都闪闪发光 ✨',           // 一句话寄语
  wish: '生日快乐！\n愿所有美好的事情都如约而至，\n愿你被世界温柔以待，\n岁岁常欢愉，年年皆胜意。',
  sign: '—— 永远爱你的朋友们',
  musicUrl: '',                              // 留空 = 内置八音盒版《生日快乐》；填 'music.mp3'（放同目录）或网络地址可换成自己的音乐
  volume: 0.8,
};
const PHOTOS = [
  { src: 'photos/photo1.jpg', caption: '那些笑到停不下来的日子' },
  { src: 'photos/photo2.jpg', caption: '最好的我们 🥂' },
  { src: 'photos/photo3.jpg', caption: '未来也要一起走呀' },
];
/* ================================================================ */

const $ = s => document.querySelector(s);
const hero = $('#hero'), overlay = $('#overlay'), musicBtn = $('#musicBtn');

/* ---------- 填充文字 ---------- */
$('#nameLine').textContent = '给最可爱的 ' + CONFIG.name;
$('#subLine').textContent = CONFIG.sub;
$('#wishText').textContent = CONFIG.wish;
$('#sign').textContent = CONFIG.sign;
document.title = '生日快乐 · ' + CONFIG.name;

/* ---------- 照片（缺失时自动显示占位图） ---------- */
function placeholderSVG(emoji, text){
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420">'
    + '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0" stop-color="#ffd3e0"/><stop offset="1" stop-color="#c9a7ff"/>'
    + '</linearGradient></defs>'
    + '<rect width="420" height="420" fill="url(#g)"/>'
    + '<text x="210" y="190" font-size="100" text-anchor="middle">' + emoji + '</text>'
    + '<text x="210" y="270" font-size="30" text-anchor="middle" fill="#7a4a86">' + text + '</text>'
    + '</svg>';
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const polaroidImgs = document.querySelectorAll('.polaroid img');
const polaroidCaps = document.querySelectorAll('.polaroid figcaption');
PHOTOS.forEach((p, i) => {
  polaroidImgs[i].addEventListener('error', () => {
    polaroidImgs[i].src = placeholderSVG('📷', '放上 TA 的照片');
  });
  polaroidImgs[i].src = p.src;
  polaroidCaps[i].textContent = p.caption;
});

/* ---------- 星星 ---------- */
const starBox = $('#stars');
for (let i = 0; i < 70; i++){
  const s = document.createElement('span');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 85 + '%';
  const sz = (Math.random() * 2.5 + 1.5).toFixed(1);
  s.style.width = sz + 'px';
  s.style.height = sz + 'px';
  s.style.animationDuration = (Math.random() * 2.5 + 2) + 's';
  s.style.animationDelay = (-Math.random() * 4) + 's';
  starBox.appendChild(s);
}

/* ---------- 气球 ---------- */
const BCOLORS = ['#ff6b9d','#ffa94d','#ffd43b','#69db7c','#4dabf7','#b197fc','#f783ac'];
const balloonBox = $('#balloons');
BCOLORS.forEach(c => {
  const b = document.createElement('div');
  b.className = 'balloon';
  const size = Math.round(42 + Math.random() * 30);
  b.style.width = size + 'px';
  b.style.height = Math.round(size * 1.25) + 'px';
  b.style.setProperty('--c', c);
  b.style.left = (4 + Math.random() * 88) + '%';
  b.style.setProperty('--d', (15 + Math.random() * 12).toFixed(1) + 's');
  b.style.setProperty('--delay', (-Math.random() * 24).toFixed(1) + 's');
  balloonBox.appendChild(b);
});

/* ---------- 画布 ---------- */
const fw = $('#fireworks'), cf = $('#confetti');
const fx = fw.getContext('2d'), cx = cf.getContext('2d');
let W = innerWidth, H = innerHeight;
function resize(){
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  [fw, cf].forEach(c => {
    c.width = W * d; c.height = H * d;
    c.style.width = W + 'px'; c.style.height = H + 'px';
  });
  fx.setTransform(d, 0, 0, d, 0, 0);
  cx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', resize);
resize();

/* ---------- 彩带 ---------- */
const CONF_COLORS = ['#ff6b9d','#ffd43b','#69db7c','#4dabf7','#b197fc','#ff8787','#ffa94d','#ffffff'];
let conf = [], rainUntil = 0;
function addConfetti(x, y, n){
  for (let i = 0; i < n; i++){
    conf.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 7,
      vy: -Math.random() * 9 - 2,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 8,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.25,
      color: CONF_COLORS[Math.random() * CONF_COLORS.length | 0],
      round: Math.random() < 0.3,
      life: 1, decay: 0.004 + Math.random() * 0.006,
    });
  }
}
function confettiRain(sec){ rainUntil = performance.now() + sec * 1000; }
function confLoop(){
  cx.clearRect(0, 0, W, H);
  if (performance.now() < rainUntil) addConfetti(Math.random() * W, -10, 2);
  conf = conf.filter(p => p.life > 0);
  for (const p of conf){
    p.vy += 0.14; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
    cx.save();
    cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.globalAlpha = Math.max(0, p.life);
    cx.fillStyle = p.color;
    if (p.round){ cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 7); cx.fill(); }
    else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  requestAnimationFrame(confLoop);
}
confLoop();

/* ---------- 烟花 ---------- */
let rockets = [], sparks = [];
function launchRocket(x, targetY){
  rockets.push({
    x: x || (W * 0.15 + Math.random() * W * 0.7),
    y: H + 10,
    vy: -(8.5 + Math.random() * 2.5),
    vx: (Math.random() - 0.5) * 1.2,
    ty: targetY || H * (0.22 + Math.random() * 0.3),
    hue: Math.random() * 360,
  });
}
function explode(r){
  boomSound();
  sparks.push({x: r.x, y: r.y, vx: 0, vy: 0, hue: r.hue, life: 0.5, decay: 0.06, big: true});
  for (let i = 0; i < 80; i++){
    const a = Math.random() * Math.PI * 2, sp = Math.random() * 5.5 + 1.5;
    sparks.push({
      x: r.x, y: r.y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      hue: r.hue + (Math.random() - 0.5) * 30,
      life: 1, decay: 0.008 + Math.random() * 0.012,
    });
  }
}
function fwLoop(){
  fx.clearRect(0, 0, W, H);
  const alive = [];
  for (const r of rockets){
    r.x += r.vx; r.y += r.vy; r.vy += 0.06;
    sparks.push({x: r.x, y: r.y, vx: (Math.random() - 0.5) * 0.6, vy: Math.random() * 0.4, hue: r.hue, life: 0.3, decay: 0.05, tiny: true});
    if (r.y <= r.ty) explode(r);
    else alive.push(r);
  }
  rockets = alive;
  sparks = sparks.filter(s => s.life > 0);
  fx.globalCompositeOperation = 'lighter';
  for (const s of sparks){
    s.x += s.vx; s.y += s.vy;
    s.vx *= 0.985; s.vy = s.vy * 0.985 + 0.035;
    s.life -= s.decay;
    let r2 = 2.2;
    if (s.tiny) r2 = 1.6;
    if (s.big) r2 = 40 * (s.life / 0.5);
    fx.globalAlpha = Math.max(0, s.life);
    fx.fillStyle = 'hsla(' + s.hue + ',100%,' + (s.tiny ? 80 : 60) + '%,1)';
    fx.beginPath(); fx.arc(s.x, s.y, r2, 0, 7); fx.fill();
  }
  fx.globalAlpha = 1;
  fx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(fwLoop);
}
fwLoop();
function fireShow(n){
  for (let i = 0; i < n; i++) setTimeout(() => launchRocket(), i * 260);
}

/* ---------- 点击首屏天空放烟花 ---------- */
hero.addEventListener('click', e => {
  if (e.target.closest('.candle')) return;
  launchRocket(e.clientX, Math.max(H * 0.2, Math.min(H * 0.7, e.clientY)));
});
$('.scroll-hint').addEventListener('click', e => {
  e.stopPropagation();
  $('.gallery').scrollIntoView({behavior: 'smooth'});
});

/* ---------- 蜡烛 ---------- */
const candleEls = Array.from(document.querySelectorAll('.candle'));
const allOut = () => candleEls.every(c => c.classList.contains('out'));
candleEls.forEach(c => {
  c.addEventListener('click', e => {
    e.stopPropagation();
    c.classList.toggle('out');
    puffSound();
    if (allOut()) finale();
  });
});
let bannerTimer = null;
function showBanner(text){
  const b = $('#wishBanner');
  b.textContent = text;
  b.classList.add('show');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => b.classList.remove('show'), 4000);
}
function finale(){
  fireShow(10);
  confettiRain(6);
  showBanner('🎉 愿望成真！');
}
$('#fireworksBtn').addEventListener('click', () => {
  fireShow(8);
  addConfetti(W / 2, H * 0.5, 120);
});

/* ---------- 音乐：内置八音盒《生日快乐》（Web Audio 合成），可选替换 musicUrl ---------- */
const NOTE_MIDI = {
  F2: 41, G2: 43, A2: 45, B2: 47,
  C3: 48, D3: 50, E3: 52, F3: 53, G3: 55, A3: 57, Bb3: 58, B3: 59,
  C4: 60, E4: 64, F4: 65,
  G4: 67, A4: 69, B4: 71, C5: 72, D5: 74, E5: 76, F5: 77, G5: 79,
};
const MELODY = [
  ['G4',1.5],['G4',0.5],['A4',2],['G4',2],['C5',2],['B4',4],
  ['G4',1.5],['G4',0.5],['A4',2],['G4',2],['D5',2],['C5',4],
  ['G4',1.5],['G4',0.5],['G5',2],['E5',2],['C5',2],['B4',2],['A4',4],
  ['F5',1.5],['F5',0.5],['E5',2],['C5',2],['D5',2],['C5',4],
];
const CHORDS = [
  ['C3','E3','G3'], ['G2','B2','D3'], ['G2','B2','D3'], ['C3','E3','G3'],
  ['C3','E3','G3'], ['C3','E3','Bb3'], ['F2','A2','C3'], ['C3','E3','G3'],
];
const EIGHTH = 0.27;
const BAR = EIGHTH * 6;
const LOOP_LEN = 48 * EIGHTH;   // 4 句 × 12 个八分音符
const midiF = m => 440 * Math.pow(2, (m - 69) / 12);

let actx = null, master = null, noiseBuf = null;
let timerId = null, loopStart = 0, musicOn = false;
let bgm = null, usingBgm = false;

function ensureCtx(){
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain();
  master.gain.value = CONFIG.volume;
  master.connect(actx.destination);
  const len = Math.floor(actx.sampleRate * 1.5);
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
}
function musicBoxNote(freq, t, dur){
  const o1 = actx.createOscillator(); o1.type = 'triangle'; o1.frequency.value = freq;
  const o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
  const g1 = actx.createGain(), g2 = actx.createGain();
  g1.gain.setValueAtTime(0.0001, t);
  g1.gain.exponentialRampToValueAtTime(0.16, t + 0.012);
  g1.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(dur, 1.5));
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.05, t + 0.01);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(dur, 0.8));
  o1.connect(g1); g1.connect(master);
  o2.connect(g2); g2.connect(master);
  o1.start(t); o1.stop(t + dur + 0.1);
  o2.start(t); o2.stop(t + dur + 0.1);
}
function bassNote(freq, t){
  const o = actx.createOscillator(); o.type = 'sine'; o.frequency.value = freq;
  const o2 = actx.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2;
  const g = actx.createGain(), g2 = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.11, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
  g2.gain.setValueAtTime(0.0001, t);
  g2.gain.exponentialRampToValueAtTime(0.03, t + 0.02);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  o.connect(g); g.connect(master);
  o2.connect(g2); g2.connect(master);
  o.start(t); o.stop(t + 1.4);
  o2.start(t); o2.stop(t + 1.0);
}
function scheduleLoopAt(t){
  let beat = 0;
  for (const note of MELODY){
    musicBoxNote(midiF(NOTE_MIDI[note[0]]), t + beat * EIGHTH, note[1] * EIGHTH + 0.25);
    beat += note[1];
  }
  CHORDS.forEach((ch, bi) => {
    ch.forEach((n, ni) => bassNote(midiF(NOTE_MIDI[n]), t + bi * BAR + ni * 0.5));
  });
}
function synthSchedule(){
  if (!musicOn || !actx) return;
  while (loopStart < actx.currentTime + 3){
    scheduleLoopAt(loopStart);
    loopStart += LOOP_LEN;
  }
}
function startSynth(){
  ensureCtx();
  if (actx.state === 'suspended') actx.resume();
  loopStart = actx.currentTime + 0.08;
  clearInterval(timerId);
  synthSchedule();
  timerId = setInterval(synthSchedule, 1500);
}
function startMusic(){
  if (musicOn) return;
  musicOn = true;
  musicBtn.classList.add('on');
  if (CONFIG.musicUrl){
    if (!bgm){
      bgm = new Audio(CONFIG.musicUrl);
      bgm.loop = true;
      bgm.volume = CONFIG.volume;
      bgm.addEventListener('error', () => { usingBgm = false; if (musicOn) startSynth(); });
    }
    usingBgm = true;
    bgm.play().catch(() => { usingBgm = false; startSynth(); });
  } else {
    startSynth();
  }
}
function stopMusic(){
  if (!musicOn) return;
  musicOn = false;
  musicBtn.classList.remove('on');
  if (usingBgm && bgm) bgm.pause();
  clearInterval(timerId);
  timerId = null;
  if (actx && actx.state === 'running') actx.suspend();
}
musicBtn.addEventListener('click', () => { if (musicOn) stopMusic(); else startMusic(); });

function puffSound(){
  if (!actx) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 700; f.Q.value = 0.8;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
  src.connect(f); f.connect(g); g.connect(master || actx.destination);
  src.start(t); src.stop(t + 0.35);
}
function boomSound(){
  if (!actx) return;
  const t = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.3, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  src.connect(f); f.connect(g); g.connect(master || actx.destination);
  src.start(t); src.stop(t + 0.55);
  const o = actx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(130, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.4);
  const og = actx.createGain();
  og.gain.setValueAtTime(0.15, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
  o.connect(og); og.connect(master || actx.destination);
  o.start(t); o.stop(t + 0.5);
}

/* ---------- 打开贺卡 ---------- */
let opened = false;
overlay.addEventListener('click', () => {
  if (opened) return;
  opened = true;
  overlay.classList.add('opening');
  document.body.classList.add('opened');
  startMusic();                                        // 用户手势 → 音乐响起（浏览器自动播放限制）
  setTimeout(() => { addConfetti(W / 2, H * 0.35, 260); confettiRain(4); }, 700);
  setTimeout(() => fireShow(6), 900);
  setTimeout(() => { overlay.style.display = 'none'; }, 1900);
});

/* ---------- 滚动显现 ---------- */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add('show'); io.unobserve(e.target); }
  });
}, { threshold: 0.15 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
